<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="assets/images/us-vaglg.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Water and sewer total calculator for the Town of Glasgow." />
    <title>Water Calculator | Town of Glasgow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div data-include="header.html"></div>

    <main id="main-content">
      <section class="section">
        <div class="container">
          <div class="section-header">
            <p class="eyebrow">Utilities</p>
            <h1>Water and Sewer Calculator</h1>
            <p>Enter your current usage value to estimate monthly charges for Town of Glasgow and Rockbridge County PSA.</p>
          </div>

          <article class="card">
            <form id="water-calc-form" class="service-request-form" novalidate>
              <div class="form-group">
                <label for="water-calc-input">Current Usage in Thousand Gallons (Usage/1000 i.e., 5900 Gallons = 5.9)</label>
                <input
                  id="water-calc-input"
                  name="water-calc-input"
                  type="number"
                  inputmode="decimal"
                  step="any"
                  min="0"
                  placeholder="Enter a decimal value"
                  required
                />
              </div>
              <div class="form-actions">
                <button type="submit" class="button button-primary">Calculate</button>
                <span id="water-calc-status" class="status-text status-info" aria-live="polite"></span>
              </div>
            </form>

            <div id="water-calc-output" class="service-request-status-card hidden" aria-live="polite">
              <h2>Output</h2>
              <div class="calc-comparison-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-top: 1rem;">
                <div class="calc-column">
                  <h3>Town of Glasgow</h3>
                  <p id="glasgow-water-charge"></p>
                  <p id="glasgow-sewer-charge"></p>
                  <p id="glasgow-grand-total"></p>
                </div>
                <div class="calc-column">
                  <h3>Rockbridge County PSA</h3>
                  <p id="water-account-charge"></p>
                  <p id="sewer-account-charge"></p>
                  <p id="water-total"></p>
                  <p id="sewer-total"></p>
                  <p id="grand-total"></p>
                </div>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-shell">
        <p>&#169; <span id="year"></span> Town of Glasgow, Virginia. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
    <script src="watercalc.js"></script>
  </body>
</html>
